
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube No-Cookie Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      overflow: hidden;
      border-radius: 12px;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    p {
      color: #bbb;
      font-size: 14px;
    }

    a {
      color: #8ab4ff;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>YouTube No-Cookie Test</h1>

    <div class="player">
      <iframe
        src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ"
        title="YouTube video player"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <p>
      Privacy-enhanced YouTube embed test.
      <a href="https://www.youtube.com/watch?v=aqz-KE-bpKQ"
         target="_blank"
         rel="noopener noreferrer">
        Open on YouTube
      </a>
    </p>
  </main>
</body>
</html>
