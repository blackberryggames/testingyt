
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Search</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#181818;position:sticky;top:0;z-index:5}
h1{margin:0 0 14px;font-size:23px}
.search{display:flex;gap:8px}
input{flex:1;min-width:0;background:#222;color:white;border:1px solid #444;border-radius:24px;padding:13px 17px;font-size:16px}
button{cursor:pointer;background:#303030;color:white;border:0;border-radius:22px;padding:12px 18px;font-size:15px}
button:hover{background:#484848}
main{max-width:1100px;margin:auto;padding:18px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#now{margin:12px 0 24px;font-size:17px;font-weight:bold}
#status{color:#bbb;margin:16px 0}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.video{background:#1b1b1b;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent}
.video:focus,.video:hover{border-color:#777;outline:none}
.video img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#222}
.info{padding:11px}
.title{font-size:15px;font-weight:bold;line-height:1.4}
.channel{font-size:13px;color:#aaa;margin-top:7px}
@media(max-width:500px){main{padding:12px}.results{grid-template-columns:1fr 1fr;gap:10px}.info{padding:8px}.title{font-size:13px}button{padding:10px 13px}}
</style>
</head>
<body>
<header>
  <h1>▶ Video Search</h1>
  <form class="search" id="searchForm">
    <input id="query" placeholder="Search YouTube..." required>
    <button type="submit">Search</button>
  </form>
</header>

<main>
  <div class="player">
    <iframe id="player"
      src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ"
      title="Video player"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
  <div id="now">Choose a video from the results</div>
  <div id="status">Search for something to get started.</div>
  <div class="results" id="results"></div>
  <button id="more" hidden>Load more</button>
</main>

<script>
const API_KEY = "AIzaSyAzipHo0_HzdCfGHHlUvx7Q519nZzm6wew";

const form = document.getElementById("searchForm");
const query = document.getElementById("query");
const results = document.getElementById("results");
const status = document.getElementById("status");
const player = document.getElementById("player");
const now = document.getElementById("now");
const more = document.getElementById("more");

let nextPageToken = "";
let currentQuery = "";
let loading = false;

async function searchVideos(loadMore = false) {
  if (loading) return;

  if (!loadMore) {
    currentQuery = query.value.trim();
    if (!currentQuery) return;
    results.replaceChildren();
    nextPageToken = "";
  }

  loading = true;
  status.textContent = "Searching...";
  more.hidden = true;

  try {
    const params = new URLSearchParams({
      key: API_KEY,
      part: "snippet",
      type: "video",
      videoEmbeddable: "true",
      q: currentQuery,
      maxResults: "12",
      safeSearch: "moderate",
      regionCode: "US"
    });

    if (loadMore && nextPageToken) {
      params.set("pageToken", nextPageToken);
    }

    const response = await fetch(
      "https://www.googleapis.com/youtube/v3/search?" + params
    );
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "Search request failed.");
    }

    nextPageToken = data.nextPageToken || "";

    if (!data.items || data.items.length === 0) {
      status.textContent = "No videos found. Try another search.";
      return;
    }

    for (const item of data.items) {
      const id = item.id.videoId;
      if (!id) continue;

      const card = document.createElement("div");
      card.className = "video";
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "Play " + item.snippet.title);

      const img = document.createElement("img");
      img.src = item.snippet.thumbnails.medium?.url ||
                item.snippet.thumbnails.default?.url || "";
      img.alt = "";
      img.loading = "lazy";

      const info = document.createElement("div");
      info.className = "info";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = item.snippet.title;

      const channel = document.createElement("div");
      channel.className = "channel";
      channel.textContent = item.snippet.channelTitle;

      info.append(title, channel);
      card.append(img, info);

      function playVideo() {
        player.src =
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(id) + "?autoplay=1";
        now.textContent = item.snippet.title;
        window.scrollTo({top: 0, behavior: "smooth"});
      }

      card.addEventListener("click", playVideo);
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          playVideo();
        }
      });

      results.append(card);
    }

    status.textContent = "Search results for: " + currentQuery;
    more.hidden = !nextPageToken;
  } catch (error) {
    status.textContent = "Error: " + error.message +
      " Check your API key and make sure YouTube Data API v3 is enabled.";
  } finally {
    loading = false;
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  searchVideos();
});

more.addEventListener("click", () => searchVideos(true));
</script>
</body>
</html>
